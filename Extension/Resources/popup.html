<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #1c4a8c; --seg: #ececf0;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #3a3a3c; --accent: #78aaeb; --seg: #2c2c2e; }
    }
    body { margin: 0; padding: 16px; min-width: 280px; background: var(--bg); color: var(--fg);
           font: 15px/1.4 -apple-system, system-ui, sans-serif; }
    h1 { font-size: 17px; margin: 0 0 2px; }
    .site { color: var(--muted); font-size: 13px; margin: 0 0 12px; word-break: break-all; }
    label.row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
                padding: 10px 0; border-top: 1px solid var(--line); }
    input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
    .group { padding: 10px 0; border-top: 1px solid var(--line); }
    .group p { margin: 0 0 8px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 3px; border-radius: 10px; background: var(--seg); }
    .seg button { font: inherit; font-size: 14px; padding: 7px 6px; border: 0; border-radius: 8px; background: transparent; color: var(--fg); }
    .seg button[aria-pressed="true"] { background: var(--bg); color: var(--accent); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    .status { color: var(--muted); font-size: 13px; padding: 10px 0 0; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <h1>DuoLargo</h1>
  <p class="site" id="site">…</p>

  <label class="row">Allarga questo sito <input type="checkbox" id="siteOn"></label>

  <div class="group">
    <p>Layout</p>
    <div class="seg">
      <button type="button" data-layout="protetto">Testo protetto</button>
      <button type="button" data-layout="tutto">Tutto schermo</button>
    </div>
    <p class="hint" id="layoutHint"></p>
  </div>

  <label class="row">Modalità diagnostica <input type="checkbox" id="diag"></label>

  <p class="status" id="status">…</p>
  <script src="popup.js"></script>
</body>
</html>
